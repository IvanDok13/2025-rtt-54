<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | QR code component</title>
  </head>
  <body
    class="body d-flex flex-column justify-content-center align-items-center min-vh-100 text-center fw-normal"
  >
    <main
      class="main d-flex flex-column justify-content-center align-items-center"
    >
      <div
        class="wrapper d-flex flex-column justify-content-center align-items-center"
      >
        <div class="card d-flex flex-column">
          <div class="image-block">
            <img
              class="qr-code"
              src="./images/image-qr-code.png"
              alt="QR Code"
            />
          </div>
          <div class="text-block">
            <h1 class="title">
              Improve your front-end skills by building projects
            </h1>
            <p class="subtitle">
              Scan the QR code to visit Frontend Mentor and take your coding
              skills to the next level
            </p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
