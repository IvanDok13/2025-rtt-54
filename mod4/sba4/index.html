<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/style.css" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./assets/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="./assets/favicon/site.webmanifest" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Task Management App</title>
  </head>
  <body>
    <main>
      <section class="input-block" aria-label="Create a task">
        <div>
          <label for="taskName">Task name:</label>
          ><input
            id="taskName"
            type="text"
            placeholder="Create about section..."
          />
        </div>

        <div>
          <label for="taskCategory">Category</label>
          <input
            id="taskCategory"
            type="text"
            list="categoryList"
            placeholder="Home, Work, Personal..."
          />
        </div>

        <div>
          <label for="taskDeadline">Deadline</label>
          <input id="taskDeadline" type="date" />
        </div>

        <div>
          <label for="taskStatus">Status</label>
          <select name="select" id="taskStatus">
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>
        </div>

        <div>
          <button>Add new task</button>
        </div>

        <div>
          <span>Filter by:</span>
          <select class="filters" id="filters">
            <option value="all">All</option>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
      </section>

      <section id="taskList">
        <div id="emptyState">
          <div>No tasks yet</div>
          <div>Add your first task using the form above.</div>
        </div>
      </section>
    </main>
  </body>
</html>
