<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>SBA5</title>
  </head>
  <body>
    <header>
      <h1>SBA5 - Blog Post Application</h1>
    </header>
    <main>
      <!-- 1) Create a section for the new post form (including input for title, textarea for content, and a submit button). 
          2) Ensure you have elements (e.g., <span>) near your form inputs to display validation error messages.-->
      <section id="post-form-section">
        <h2>Create a New Blog Post</h2>
        <form id="post-form">
          <div>
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required />
            <span id="title-error" class="error-message"></span>
          </div>
          <div>
            <label for="content">Content:</label>
            <textarea id="content" name="content" required></textarea>
            <span id="content-error" class="error-message"></span>
          </div>
          <button type="submit">Submit</button>
        </form>
      </section>
      <!-- Create a section where the list of blog posts will be displayed dynamically. -->
      <section id="posts-section">
        <h2>Blog Posts</h2>
        <div id="posts-list"></div>
      </section>
    </main>

    <script type="module" src="./script.js"></script>
  </body>
</html>
